name: Publish signed AI Trainer updates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag (blank selects latest release)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-trainer-public-updates
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Read configured Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Verify signatures and prepare current public update
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          UPDATE_PUBLIC_KEY: |
