        shell: bash
        run: |
          printf '%s\n' "$UPDATE_PUBLIC_KEY" > update-public-key.pem
          python3 - --public-key update-public-key.pem --output _public-update <<'PY'
          #!/usr/bin/env python3
          """Publish only locally signed assets from the public downloads repository.
          
          Uses the Actions GITHUB_TOKEN through gh; no token is sent to the public site.
          No private key is required on GitHub. OpenSSL and gh are supplied by the runner.
          """
          from __future__ import annotations
          
          import argparse
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import tempfile
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import HTTPSHandler, HTTPRedirectHandler, Request, build_opener
          import zipfile
          
          MAX_PACKAGE = 512 * 1024**2
          MAX_EXPANDED = 1536 * 1024**2
          PROTECTED = {"data", "profile", "profiles", "updates", "backups", "default-profile.json"}
          RELEASE_ID = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,79}\Z")
          HASH = re.compile(r"[0-9a-fA-F]{64}\Z")
          SOURCE_SUFFIXES = {".pdb", ".cs", ".csx", ".fs", ".fsx", ".vb", ".py", ".pyw", ".pyi", ".pyx", ".pxd", ".js", ".jsx",
                             ".ts", ".tsx", ".c", ".cc", ".cpp", ".h", ".hpp", ".csproj", ".fsproj", ".vbproj",
                             ".sln", ".slnx", ".props", ".targets", ".ps1", ".psm1", ".cmd", ".bat", ".sh", ".yml",
                             ".yaml", ".ipynb", ".map", ".resx", ".razor", ".xaml", ".pfx", ".p12", ".key", ".dpapi",
                             ".zip", ".7z", ".tar", ".gz", ".gzip", ".xz", ".tgz", ".bz2", ".tbz2", ".zst", ".rar",
                             ".cab", ".iso", ".img", ".whl", ".egg", ".jar", ".nupkg", ".snupkg"}
          
          
          # Exact upstream archives required by the runtime and third-party license notices.
          ALLOWED_ARCHIVES = {'licenses/FFmpeg-Sources/build/aom/aom-src-v3.9.0.tar.xz': '674AA4E992C6F5517AC88F927C461FA775C0EC6B5FED9C24E61D3A2CD97528B9', 'licenses/FFmpeg-Sources/build/ffmpeg/ffmpeg-src-n4.4.4.tar.xz': '20A10677D67F8E524E5159C860E1A36333D40B60A8C1A83C9890E536832B6818', 'licenses/FFmpeg-Sources/build/libvpx/libvpx-src-v1.14.0.tar.xz': '4CB354C566F324AF1B0264475CB1A3B4FFEFC93199869E0F080F47A8BAC17976', 'licenses/FFmpeg-Sources/build/openh264/openh264-api-headers-v1.8.0.tar.xz': '90C9333FE8DD9CE8F6585B7A2DAE595276338F42B2850DBE2A75218E2957D1DB', 'licenses/FFmpeg-Sources/opencv_ffmpeg.tar.xz': 'BFC957C9E53086410BDCEC8DB406951D1D362556ACA805B8B732DEA6C2D69ABC', 'licenses/FFmpeg-Sources/opencv/opencv-videoio-ffmpeg.tar.xz': '70B11035EC264811BC6502B110E5B37C55D3D9C72A61D31821EEB12E9A585927', 'ps5/runtime-binary-v1/python313.zip': '58AF5BF33DCFDEDF72F60B0926FDB619CC2960C9D4200677531D35F626C8EE24'}
          
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          
          
          def unique_object(pairs):
              result, seen = {}, set()
              for key, value in pairs:
                  require(key.casefold() not in seen, "Duplicate JSON property")
                  result[key] = value
                  seen.add(key.casefold())
              return result
          
          
          def read_json(raw):
              return json.loads(raw.decode("utf-8"), object_pairs_hook=unique_object,
                                parse_constant=lambda _: (_ for _ in ()).throw(ValueError("Non-finite JSON value")))
          
          
          def exact_keys(value, expected):
              require(type(value) is dict and set(value) == set(expected.split()), "Unexpected manifest fields")
          
          
          def integer(value, minimum, maximum):
              require(type(value) is int and minimum <= value <= maximum, "Integer outside updater limits")
          
          
          def safe_path(value):
              require(type(value) is str and 0 < len(value) <= 240, "Invalid package path")
              require(not any(ord(c) < 32 or ord(c) == 127 or c in '\\:<>"|?*' for c in value), "Unsafe package path")
              parts = value.split("/")
              for part in parts:
                  require(0 < len(part) <= 120 and part not in (".", "..") and not part.startswith(" ")
                          and not part.endswith((" ", ".")), "Unsafe path component")
                  require(not re.fullmatch(r"CON|PRN|AUX|NUL|CONIN\$|CONOUT\$|COM[1-9¹²³]|LPT[1-9¹²³]", part.split(".")[0], re.I),
                          "Reserved Windows path")
              require(parts[0].casefold() not in PROTECTED and not parts[0].casefold().startswith(".v3-"),
                      "Personal data or updater state in package")
              require((Path(value).suffix.casefold() not in SOURCE_SUFFIXES or value in ALLOWED_ARCHIVES)
                      and not {p.casefold() for p in parts}.intersection({".git", ".env", "signing-key.dpapi"}),
                      "V3 source, symbols, secrets, and unapproved nested archives must not be published")
              return value
          
          
          def check_paths(items, with_size):
              require(type(items) is list and 1 <= len(items) <= 4096, "Invalid file count")
              names, expanded = set(), 0
              for item in items:
                  exact_keys(item, "path size sha256" if with_size else "path sha256")
                  path = safe_path(item["path"]).casefold()
                  require(path not in names, "Duplicate file path")
                  names.add(path)
                  require(type(item["sha256"]) is str and HASH.fullmatch(item["sha256"]), "Invalid file hash")
                  if item["path"] in ALLOWED_ARCHIVES:
                      require(item["sha256"].upper() == ALLOWED_ARCHIVES[item["path"]], "Approved runtime/license archive differs from its pinned checksum")
                  if with_size:
                      integer(item["size"], 0, MAX_PACKAGE)
                      expanded += item["size"]
              for path in names:
                  parts = path.split("/")
                  require(not any("/".join(parts[:i]) in names for i in range(1, len(parts))), "File/directory collision")
              require(expanded <= MAX_EXPANDED, "Expanded package too large")
          
          
          def https_url(value):
              require(type(value) is str, "URL must be a string")
              parsed = urlsplit(value)
              require(parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password
                      and not parsed.fragment and not parsed.query, "Expected plain HTTPS URL")
              return parsed
          
          
          def verify_envelope(raw, public_key, pages_base):
              require(0 < len(raw) <= 2 * 1024**2, "Envelope too large")
              envelope = read_json(raw)
              exact_keys(envelope, "schema payload signature")
              require(type(envelope["schema"]) is int and envelope["schema"] == 1, "Unsupported envelope schema")
              require(type(envelope["payload"]) is str and type(envelope["signature"]) is str, "Invalid envelope")
              payload = base64.b64decode(envelope["payload"], validate=True)
              signature = base64.b64decode(envelope["signature"], validate=True)
              require(0 < len(payload) <= 1024**2 and 256 <= len(signature) <= 1024, "Invalid signed payload size")
              with tempfile.TemporaryDirectory(prefix="v3-signature-") as temporary:
                  payload_file, signature_file = Path(temporary) / "payload", Path(temporary) / "signature"
                  payload_file.write_bytes(payload)
                  signature_file.write_bytes(signature)
                  checked = subprocess.run(["openssl", "dgst", "-sha256", "-verify", str(public_key),
                                            "-signature", str(signature_file), str(payload_file)], capture_output=True)
                  require(checked.returncode == 0, "Release signature did not match the pinned public key")
              manifest = read_json(payload)
              exact_keys(manifest, "product channel sequence releaseId version notes publishedUtc minimumUpdaterVersion package files baseFiles")
              require(manifest["product"] == "ai-trainer-v3" and manifest["channel"] == "stable", "Wrong product/channel")
              integer(manifest["sequence"], 1, 9007199254740991)
              integer(manifest["minimumUpdaterVersion"], 1, 1)
              require(type(manifest["releaseId"]) is str and RELEASE_ID.fullmatch(manifest["releaseId"]), "Invalid release ID")
              require(type(manifest["version"]) is str and len(manifest["version"]) <= 50
                      and re.fullmatch(r"\d+\.\d+(?:\.\d+){0,2}", manifest["version"])
                      and all(int(n) <= 2147483647 for n in manifest["version"].split(".")), "Invalid version")
              require(type(manifest["notes"]) is str and len(manifest["notes"]) <= 16000, "Invalid notes")
              from datetime import datetime
              require(type(manifest["publishedUtc"]) is str, "Invalid timestamp")
              # .NET emits seven fractional digits; Python <=3.10 accepts at most six.
              timestamp_text = manifest["publishedUtc"].replace("Z", "+00:00")
              timestamp_text = re.sub(r"(\.\d{6})\d+(?=[+-]\d{2}:\d{2}$)", r"\1", timestamp_text)
              timestamp = datetime.fromisoformat(timestamp_text)
              require(timestamp.year > 1 and timestamp.utcoffset() is not None, "Timestamp requires timezone")
              package = manifest["package"]
              exact_keys(package, "url size sha256")
              integer(package["size"], 1, MAX_PACKAGE)
              require(type(package["sha256"]) is str and HASH.fullmatch(package["sha256"]), "Invalid archive hash")
              https_url(package["url"])
              require(package["url"] == pages_base.rstrip("/") + "/releases/" + manifest["releaseId"] + ".zip",
                      "Signed package URL differs from this Pages site; create a newly signed release with the correct base URL")
              check_paths(manifest["files"], True)
              check_paths(manifest["baseFiles"], False)
              return manifest
          
          
          def sha256_file(path):
              with path.open("rb") as source:
                  digest = hashlib.sha256()
                  while block := source.read(131072):
                      digest.update(block)
                  return digest.hexdigest()
          
          
          def verify_archive(path, manifest):
              package = manifest["package"]
              require(path.stat().st_size == package["size"] and sha256_file(path) == package["sha256"].lower(), "ZIP hash/size mismatch")
              expected = {f["path"]: f for f in manifest["files"]}
              visited, names = set(), set()
              with zipfile.ZipFile(path) as archive:
                  require(len(archive.infolist()) <= 8192, "Too many ZIP entries")
                  for entry in archive.infolist():
                      relative = entry.filename.rstrip("/") if entry.is_dir() else entry.filename
                      safe_path(relative)
                      require(relative.casefold() not in names, "Duplicate ZIP entry")
                      names.add(relative.casefold())
                      mode = entry.external_attr >> 16
                      require(stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR)
                              and not entry.external_attr & 0x400, "ZIP links/reparse points are prohibited")
                      require(not entry.flag_bits & 1, "Encrypted ZIP entries are prohibited")
                      if entry.is_dir():
                          require(any(name.startswith(relative + "/") for name in expected), "Unexpected ZIP directory")
                          continue
                      require(entry.filename in expected, "Unexpected ZIP file")
                      item = expected[entry.filename]
                      require(entry.file_size == item["size"], "ZIP entry length mismatch")
                      with archive.open(entry) as source:
                          digest, actual = hashlib.sha256(), 0
                          while block := source.read(131072):
                              actual += len(block)
                              require(actual <= item["size"], "Expanded ZIP entry exceeds declared size")
                              digest.update(block)
                      require(actual == item["size"] and digest.hexdigest() == item["sha256"].lower(), "ZIP entry hash mismatch")
                      visited.add(entry.filename)
              require(visited == set(expected), "ZIP is missing program files")
          
          
          def gh_json(*args):
              process = subprocess.run(["gh", *args], capture_output=True)
              require(process.returncode == 0, "GitHub metadata request failed; check Actions contents:read permission")
              return json.loads(process.stdout)
          
          
          def download_asset(repo, tag, name, directory):
              # Do not include command output or GH_TOKEN in diagnostics.
              process = subprocess.run(["gh", "release", "download", tag, "--repo", repo,
                                        "--pattern", name, "--dir", str(directory)], capture_output=True)
              require(process.returncode == 0, "Could not download a required release asset")
              path = directory / name
              require(path.is_file() and not path.is_symlink(), "Missing release asset")
              return path
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("Pages feed redirected; use the final public Pages URL")
          
          
          def current_manifest(pages_base, public_key):
              # Anonymous request, so the Actions repository token never reaches Pages.
              request = Request(pages_base.rstrip("/") + "/stable.json", headers={"Cache-Control": "no-cache"})
              try:
                  with build_opener(HTTPSHandler(), NoRedirect()).open(request, timeout=30) as response:
                      raw = response.read(2 * 1024**2 + 1)
                  return verify_envelope(raw, public_key, pages_base)
              except HTTPError as error:
                  if error.code == 404:  # First publication only.
                      return None
                  raise ValueError("Cannot verify the current public feed; deployment stopped") from error
          
          
          def prepare(args):
              public_key = Path(args.public_key).resolve(strict=True)
              require(public_key.is_file() and not public_key.is_symlink(), "Public-key file missing")
              require(b"PRIVATE KEY" not in public_key.read_bytes(), "Expected a public key, never a private key")
              pages_base = args.base_url.rstrip("/")
              https_url(pages_base)
              require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", args.repo), "Invalid repository name")
              output = Path(args.output).absolute()
              require(not output.exists(), "Pages output must be a new directory")
              live = current_manifest(pages_base, public_key)
              endpoint = "repos/" + args.repo + "/releases/latest"
              if args.tag:
                  from urllib.parse import quote
                  endpoint = "repos/" + args.repo + "/releases/tags/" + quote(args.tag, safe="")
              release = gh_json("api", endpoint)
              require(not release["draft"] and not release["prerelease"], "Select a published stable release")
              assets = {a["name"]: a for a in release["assets"]}
              require("stable.json" in assets and assets["stable.json"]["size"] <= 2 * 1024**2, "Missing or oversized signed manifest")
              with tempfile.TemporaryDirectory(prefix="v3-pages-") as temporary:
                  temporary = Path(temporary)
                  manifest_path = download_asset(args.repo, release["tag_name"], "stable.json", temporary)
                  require(manifest_path.stat().st_size <= 2 * 1024**2, "Release manifest too large")
                  latest = verify_envelope(manifest_path.read_bytes(), public_key, pages_base)
                  if live:
                      require(latest["sequence"] >= live["sequence"], "Refusing to roll the public feed back to an older sequence")
                      if latest["sequence"] == live["sequence"]:
                          require(latest == live, "Published sequence has been reused for different contents")
                  name = latest["releaseId"] + ".zip"
                  require(name in assets and assets[name]["size"] == latest["package"]["size"], "Missing or incorrectly sized release ZIP")
                  path = download_asset(args.repo, release["tag_name"], name, temporary)
                  verify_archive(path, latest)
                  # Nothing outside these two signed release files enters the Pages artifact.
                  (output / "releases").mkdir(parents=True)
                  shutil.copyfile(path, output / "releases" / name)
                  shutil.copyfile(manifest_path, output / "stable.json")
                  print(f"Prepared current signed sequence {latest['sequence']} ({latest['version']}); no older packages retained.")
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repo", default=os.environ.get("GITHUB_REPOSITORY"), required=not os.environ.get("GITHUB_REPOSITORY"))
              parser.add_argument("--base-url", default=os.environ.get("PAGES_BASE_URL"), required=not os.environ.get("PAGES_BASE_URL"))
              parser.add_argument("--tag", default=os.environ.get("RELEASE_TAG", ""))
              parser.add_argument("--public-key", default="tools/updates/update-public-key.pem")
              parser.add_argument("--output", default="_public-update")
              args = parser.parse_args()
              try:
                  prepare(args)
              except (ValueError, OSError, subprocess.SubprocessError, zipfile.BadZipFile) as error:
                  parser.exit(1, "Update publication stopped: " + str(error) + "\n")
          
          
          if __name__ == "__main__":
              main()
          PY
      - name: Upload only the current signed manifest and ZIP
        uses: actions/upload-pages-artifact@v4
        with:
          path: _public-update
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy current update
        id: deployment
        uses: actions/deploy-pages@v4
